# Builds ready-to-run File Picker programs for Windows, macOS and Linux.
#
#   * every push to main and every manual run: tests, then packages -> download from the run's "Artifacts"
#   * pushing a tag like v2.1.0:              the same, then publishes a GitHub Release with the files
#
# To make a release:   git tag v2.1.0 && git push origin v2.1.0
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  package:
    name: Package (${{ matrix.name }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, name: windows-x64 }
          - { os: macos-latest,   name: macos-arm64 }
          - { os: ubuntu-latest,  name: linux-x64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libglib2.0-0

      # The packaging scripts build the engine, bundle everything with PyInstaller and
      # run the app's self-test (--check) on the result; they fail the step if it does not work.
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./package.ps1
      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x build.sh package.sh
          ./package.sh

      - name: Collect the files
        shell: bash
        run: |
          mkdir -p artifacts
          case "${{ runner.os }}" in
            Windows) cp dist/FilePicker.exe "artifacts/FilePicker-${{ matrix.name }}.exe" ;;
            macOS)   ditto -c -k --sequesterRsrc --keepParent dist/FilePicker.app "artifacts/FilePicker-${{ matrix.name }}.zip" ;;
            Linux)   tar -czf "artifacts/FilePicker-${{ matrix.name }}.tar.gz" -C dist FilePicker ;;
          esac
          ls -lh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: FilePicker-${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  engine:
    name: Command-line engine (all platforms)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
          cache: false
      - name: Cross-compile
        run: |
          chmod +x build.sh
          ./build.sh all
      - name: Archive
        run: |
          mkdir -p artifacts
          for dir in dist/engine/*/; do
            target=$(basename "$dir")
            if [[ $target == windows-* ]]; then
              (cd "$dir" && zip -q "$GITHUB_WORKSPACE/artifacts/picker-engine-$target.zip" picker.exe)
            else
              tar -czf "artifacts/picker-engine-$target.tar.gz" -C "$dir" picker
            fi
          done
          ls -lh artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: picker-engine
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, engine]
    runs-on: ubuntu-latest
    permissions:
      contents: write           # needed to create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: |
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
